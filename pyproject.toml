[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-target-simulator"
version = "0.1.0"
description = "Target-level radar software test simulator"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1", "pygame==2.6.1", "pydantic>=2,<3", "PyYAML>=6", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

