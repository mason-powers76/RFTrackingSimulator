# Synthetic software-test values, not RC-car measurements or TI specifications.
room:
  width_m: 2.0
  height_m: 2.0
simulation:
  physics_rate_hz: 50
  gui_rate_hz: 60
  random_seed: 42
vehicle:
  wheelbase_m: 0.25
  radius_m: 0.12
  max_forward_speed_mps: 2.0
  max_reverse_speed_mps: 1.0
  max_acceleration_mps2: 2.5
  max_braking_mps2: 3.0
  max_steering_deg: 35
radar:
  point_cloud_enabled: true
  points_per_object: 12
  point_detection_probability: 0.9
  sensor_height_m: 3.0
  range_noise_std_m: 0.04
  angle_noise_std_rad: 0.01
  doppler_noise_std_mps: 0.05
  snr_reference_db: 30.0
  snr_range_loss_db_per_m: 2.0
  measurement_rate_hz: 20
  position_noise_std_m: 0.04
  velocity_noise_std_mps: 0.05
  detection_probability: 0.98
  false_alarm_probability: 0.0
  latency_ms: 30
  minimum_range_m: 0.1
  maximum_range_m: 10
  sensor_x_m: 1.0
  sensor_y_m: 1.0
  legacy_horizontal_range: false
  snr_noise_std_db: 1.0
network:
  enabled: false
  host: 127.0.0.1
  port: 5005
scenario:
  cruise_speed_mps: 0.75
  waypoint_tolerance_m: 0.22
  loop: true
targets:
  - target_id: 1
    name: RC car 1
    initial_x: 0.5
    initial_y: 0.5
    initial_heading: 0.0
    reflector_enabled: false
    reflector_gain_db: 6.0
    length_m: 0.35
    width_m: 0.20
    height_m: 0.12
    scattering_gain_db: 0.0
  - target_id: 2
    name: RC car 2
    initial_x: 1.5
    initial_y: 1.5
    initial_heading: 3.141592653589793
